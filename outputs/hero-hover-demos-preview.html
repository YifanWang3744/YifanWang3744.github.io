  #hero-hover-demos .hero-trigger {
    display: block;
    position: relative;
    width: 100%;
    height: 100%;
    padding: 48px clamp(26px,6vw,56px);
    border: 0;
    background: transparent;
    color: inherit;
    text-align: left;
    font: inherit;
    touch-action: manipulation;
  }
  #hero-hover-demos .role-arrow {
    display: block;
    position: relative;
    width: 42px;
    height: 42px;
    margin: 0 0 32px 5px;
    transform-origin: center;
  }
  #hero-hover-demos .role-arrow::before {
    content: &quot;&quot;;
    position: absolute;
    left: 0;
    top: 0;
    width: 56px;
    height: 1.5px;
    background: currentColor;
    transform: rotate(45deg);
    transform-origin: left center;
  }
  #hero-hover-demos .role-arrow::after {
    content: &quot;&quot;;
    position: absolute;
    width: 34px;
    height: 34px;
    right: 1px;
    bottom: 1px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
  }
  #hero-hover-demos .role-heading {
    display: block;
    font-size: clamp(29px,6vw,48px);
    font-weight: 400;
    line-height: 1.18;
    letter-spacing: -.025em;
  }
  #hero-hover-demos .role-subtitle {
    display: block;
    margin-top: 26px;
    font-size: clamp(16px,2.7vw,22px);
    font-weight: 400;
    line-height: 1.5;
    color: #f0f2f3;
  }
  #hero-hover-demos .role-word { display: inline-block; white-space: nowrap; }
  #hero-hover-demos .role-letter { display: inline-block; text-align: center; }
  #hero-hover-demos .paper-plane {
    position: absolute;
    left: 0;
    top: 0;
    width: 40px;
    height: 28px;
    opacity: 0;
    pointer-events: none;
    transform-origin: center;
  }
  #hero-hover-demos .plane-wing { position: absolute; inset: 0; }
  #hero-hover-demos .wing-left { background: #fff; clip-path: polygon(0 0,100% 50%,33% 50%); }
  #hero-hover-demos .wing-right { background: #dbe4eb; clip-path: polygon(0 100%,100% 50%,33% 50%); }
  #hero-hover-demos .plane-fold { position: absolute; inset: 0; background: #aebdca; clip-path: polygon(33% 50%,100% 50%,25% 76%); }
  #hero-hover-demos .flight-trail { position: absolute; inset: 0; pointer-events: none; }
  #hero-hover-demos .trail-dot { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: 0; }
  #hero-hover-demos .node-field { position: absolute; left: 0; right: 0; bottom: 18px; height: 66px; pointer-events: none; opacity: 0; }
  #hero-hover-demos .network-node { position: absolute; width: 7px; height: 7px; border: 1px solid currentColor; border-radius: 50%; background: var(--hero-sky); }
  #hero-hover-demos .network-edge { position: absolute; height: 1px; background: #ffffff70; transform-origin: left center; }
  #hero-hover-demos .network-packet { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: currentColor; box-shadow: 0 0 9px #ffffff90; }
  @media (max-width: 420px) {
    #hero-hover-demos .hero-trigger { padding-top: 42px; padding-bottom: 64px; }
    #hero-hover-demos .role-arrow { margin-bottom: 28px; width: 34px; height: 34px; }
    #hero-hover-demos .role-arrow::before { width: 45px; }
    #hero-hover-demos .role-arrow::after { width: 28px; height: 28px; }
    #hero-hover-demos .role-subtitle { margin-top: 20px; }
    #hero-hover-demos .node-field { bottom: 10px; height: 48px; }
  }
&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;hero-hover-demos&#x27;);
  const reduced = matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
  const clamp = x =&gt; Math.max(0,Math.min(1,x));
  const smooth = x =&gt; { const t = clamp(x); return t*t*(3-2*t); };
  root.querySelectorAll(&#x27;.hero-demo&#x27;).forEach(stage =&gt; {
    const trigger = stage.querySelector(&#x27;button&#x27;);
    const heading = stage.querySelector(&#x27;.role-heading&#x27;);
    const arrow = stage.querySelector(&#x27;.role-arrow&#x27;);
    const settings = { strength: 1 };
