  <script>
    (() => {
      function showCopyToast(message) {
        let toast = document.getElementById("copy-toast");
        if (!toast) {
          toast = document.createElement("div");
          toast.id = "copy-toast";
          toast.className = "fixed left-1/2 -translate-x-1/2 bottom-20 z-[60] px-3 py-1.5 rounded-md text-xs md:text-sm bg-black/85 text-white opacity-0 pointer-events-none transition-opacity duration-200";
          document.body.appendChild(toast);
        }

        toast.textContent = message;
        toast.classList.remove("opacity-0");
        toast.classList.add("opacity-100");

        clearTimeout(window.__copyToastTimer);
        window.__copyToastTimer = setTimeout(() => {
          toast.classList.remove("opacity-100");
          toast.classList.add("opacity-0");
        }, 1200);
      }

      async function copyValue(value, label) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(value);
          } else {
            const textArea = document.createElement("textarea");
            textArea.value = value;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
          }
          showCopyToast(`Copied ${label}`);
        } catch (error) {
          showCopyToast("Copy failed");
        }
      }

      function getCopyTarget(target) {
        return target.closest("[data-copy-value]");
      }

      document.addEventListener("click", (event) => {
        const target = getCopyTarget(event.target);
        if (!target) return;
        copyValue(target.dataset.copyValue || target.textContent.trim(), target.dataset.copyLabel || "text");
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const target = getCopyTarget(event.target);
        if (!target) return;
        event.preventDefault();
        copyValue(target.dataset.copyValue || target.textContent.trim(), target.dataset.copyLabel || "text");
      });
    })();
  </script>
